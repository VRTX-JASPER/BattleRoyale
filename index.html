<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINECRAFT</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="loading">Loading BrowserCraft...</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

document.getElementById("loading").style.display = "none";

/*
    Temporary 3D-style test world.

    This is NOT the final renderer.
    We're using it to make sure GitHub Pages,
    JavaScript, and the browser canvas work.
*/

let camera = {
    x: 0,
    y: 0,
    z: 0
};

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ground
    ctx.fillStyle = "#4CAF50";
    ctx.fillRect(
        0,
        canvas.height / 2,
        canvas.width,
        canvas.height / 2
    );

    // Horizon
    ctx.fillStyle = "#6B8E23";
    ctx.fillRect(
        0,
        canvas.height / 2 - 10,
        canvas.width,
        10
    );

    // Center cube
    const size = 150;

    const x = canvas.width / 2 - size / 2;
    const y = canvas.height / 2 - size / 2;

    // Front
    ctx.fillStyle = "#777";
    ctx.fillRect(x, y, size, size);

    // Top
    ctx.fillStyle = "#999";

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 30, y - 30);
    ctx.lineTo(x + size + 30, y - 30);
    ctx.lineTo(x + size, y);
    ctx.closePath();
    ctx.fill();

    // Right side
    ctx.fillStyle = "#555";

    ctx.beginPath();
    ctx.moveTo(x + size, y);
    ctx.lineTo(x + size + 30, y - 30);
    ctx.lineTo(x + size + 30, y + size - 30);
    ctx.lineTo(x + size, y + size);
    ctx.closePath();
    ctx.fill();
}

function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
