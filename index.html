<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MineCraft Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="crosshair">+</div>
  <div id="hud">
    <div>WASD Move · Space Jump · Mouse Look</div>
    <div>Left Click Break · Right Click Place · 1–5 Select Block · Esc Release</div>
  </div>

  <div id="hotbar"></div>
  <div id="startScreen">
    <h1>MineCraft Web</h1>
    <p>Browser voxel prototype</p>
    <button id="playButton">CLICK TO PLAY</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
