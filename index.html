<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineCraft</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial;
            font-size: 20px;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }

        #start {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 25px;
            font-family: Arial;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial;
            text-shadow: 1px 1px 3px black;
            pointer-events: none;
        }
    </style>
</head>

<body>

<button id="start">CLICK TO PLAY</button>

<div id="crosshair">+</div>

<div id="info">
    WASD = Move<br>
    Mouse = Look<br>
    ESC = Release Mouse
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

//////////////////////////////////////////////////////
// SCENE
//////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87CEEB);


//////////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////////

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 2, 5);


//////////////////////////////////////////////////////
// RENDERER
//////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


//////////////////////////////////////////////////////
// LIGHTING
//////////////////////////////////////////////////////

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.7
);

scene.add(ambientLight);


const sun = new THREE.DirectionalLight(
    0xffffff,
    1
);

sun.position.set(
    50,
    100,
    50
);

scene.add(sun);


//////////////////////////////////////////////////////
// GROUND
//////////////////////////////////////////////////////

const groundGeometry = new THREE.BoxGeometry(
    40,
    1,
    40
);

const groundMaterial = new THREE.MeshLambertMaterial({
    color: 0x55AA33
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.position.y = -0.5;

scene.add(ground);


//////////////////////////////////////////////////////
// TEST BLOCK
//////////////////////////////////////////////////////

const blockGeometry = new THREE.BoxGeometry(
    1,
    1,
    1
);

const blockMaterial = new THREE.MeshLambertMaterial({
    color: 0x888888
});

const block = new THREE.Mesh(
    blockGeometry,
    blockMaterial
);

block.position.set(
    0,
    0.5,
    0
);

scene.add(block);


//////////////////////////////////////////////////////
// SECOND BLOCK
//////////////////////////////////////////////////////

const block2 = new THREE.Mesh(
    blockGeometry,
    new THREE.MeshLambertMaterial({
        color: 0x777777
    })
);

block2.position.set(
    2,
    0.5,
    0
);

scene.add(block2);


//////////////////////////////////////////////////////
// THIRD BLOCK
//////////////////////////////////////////////////////

const block3 = new THREE.Mesh(
    blockGeometry,
    new THREE.MeshLambertMaterial({
        color: 0x999999
    })
);

block3.position.set(
    -2,
    0.5,
    0
);

scene.add(block3);


//////////////////////////////////////////////////////
// PLAYER
//////////////////////////////////////////////////////

const player = {
    height: 1.8,
    speed: 0.08
};


//////////////////////////////////////////////////////
// KEYBOARD
//////////////////////////////////////////////////////

const keys = {};

document.addEventListener("keydown", function(event) {
    keys[event.code] = true;
});

document.addEventListener("keyup", function(event) {
    keys[event.code] = false;
});


//////////////////////////////////////////////////////
// MOUSE LOOK
//////////////////////////////////////////////////////

let yaw = 0;
let pitch = 0;

let mouseLocked = false;


document.addEventListener(
    "pointerlockchange",
    function() {

        mouseLocked =
            document.pointerLockElement === document.body;

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (!mouseLocked) return;

        const sensitivity = 0.002;

        yaw -= event.movementX * sensitivity;

        pitch -= event.movementY * sensitivity;

        // Prevent looking completely upside down

        const limit = Math.PI / 2 - 0.01;

        pitch = Math.max(
            -limit,
            Math.min(limit, pitch)
        );

    }
);


//////////////////////////////////////////////////////
// START BUTTON
//////////////////////////////////////////////////////

const startButton =
    document.getElementById("start");


startButton.addEventListener(
    "click",
    function() {

        document.body.requestPointerLock();

        startButton.style.display = "none";

    }
);


//////////////////////////////////////////////////////
// MOVEMENT
//////////////////////////////////////////////////////

function updatePlayer() {

    const speed = player.speed;

    let forward = 0;
    let right = 0;

    if (keys["KeyW"])
        forward += 1;

    if (keys["KeyS"])
        forward -= 1;

    if (keys["KeyD"])
        right += 1;

    if (keys["KeyA"])
        right -= 1;


    // Normalize diagonal movement

    if (forward !== 0 && right !== 0) {

        forward *= 0.7071;
        right *= 0.7071;

    }


    // Direction based on camera rotation

    camera.position.x +=
        Math.sin(yaw) * forward * speed;

    camera.position.z +=
        Math.cos(yaw) * forward * speed;


    camera.position.x +=
        Math.cos(yaw) * right * speed;

    camera.position.z -=
        Math.sin(yaw) * right * speed;


    // Camera height

    camera.position.y = player.height;


    // Apply rotation

    camera.rotation.order = "YXZ";

    camera.rotation.y = yaw;

    camera.rotation.x = pitch;

}


//////////////////////////////////////////////////////
// RESIZE
//////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


//////////////////////////////////////////////////////
// GAME LOOP
//////////////////////////////////////////////////////

function gameLoop() {

    updatePlayer();

    renderer.render(
        scene,
        camera
    );

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();

</script>

</body>
</html>
